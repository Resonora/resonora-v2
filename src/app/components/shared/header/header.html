<header class="nav">
  <a class="brand" routerLink="/" (click)="closeMenus()">RESONORA</a>
  <nav class="navlinks" aria-label="Hovedmenu">
    <div class="handpan-nav" (pointerenter)="openHandpanOnHover($event)"
      (pointerleave)="closeHandpanOnHoverLeave($event)"
      (focusout)="closeHandpanOnFocusOut($event)" (keydown.escape)="closeHandpanMenu(desktopHandpanToggle)">
      <button #desktopHandpanToggle class="handpan-toggle" type="button"
        [attr.aria-expanded]="handpanMenuOpen()" aria-controls="desktopHandpanLinks"
        (click)="toggleHandpanMenu($event)">
        Handpan <span class="handpan-chevron" aria-hidden="true"></span>
      </button>
      <div class="handpan-dropdown" id="desktopHandpanLinks" [hidden]="!handpanMenuOpen()">
        <a routerLink="/handpan" (click)="closeMenus()">Handpan intro</a>
        <a routerLink="/handpan/for-nysgerrige" (click)="closeMenus()">For den nysgerrige</a>
        <a routerLink="/handpan/for-begynderen" (click)="closeMenus()">For begynderen</a>
        <a routerLink="/handpan/for-dig-med-handpan" (click)="closeMenus()">For dig med egen handpan</a>
      </div>
    </div>
    <a routerLink="/lyd" (click)="closeMenus()">Lydmeditation</a>
    <a routerLink="/om" (click)="closeMenus()">Vision</a>
    <a class="navcta" routerLink="/kontakt" (click)="closeMenus()">Kontakt</a>
  </nav>
  <button class="menu-btn" type="button" [attr.aria-label]="menuOpen() ? 'Luk menu' : 'Åbn menu'"
    [attr.aria-expanded]="menuOpen()" aria-controls="mobileLinks" (click)="toggleMenu()">
    ☰
  </button>
  <nav class="mobile-links" id="mobileLinks" aria-label="Mobilmenu" [hidden]="!menuOpen()">
    
    <div class="handpan-nav" (focusout)="closeHandpanOnFocusOut($event)" (keydown.escape)="closeHandpanMenu(mobileHandpanToggle)">
      <button #mobileHandpanToggle class="handpan-toggle" type="button"
        [attr.aria-expanded]="handpanMenuOpen()" aria-controls="mobileHandpanLinks"
        (click)="toggleHandpanMenu($event)">
        Handpan <span class="handpan-chevron" aria-hidden="true"></span>
      </button>
      <div class="handpan-dropdown" id="mobileHandpanLinks" [hidden]="!handpanMenuOpen()">
        <a routerLink="/handpan" (click)="closeMenus()">Handpan intro</a>
        <a routerLink="/handpan/for-nysgerrige" (click)="closeMenus()">For den nysgerrige</a>
        <a routerLink="/handpan/for-begynderen" (click)="closeMenus()">For begynderen</a>
        <a routerLink="/handpan/for-dig-med-handpan" (click)="closeMenus()">For dig med egen handpan</a>
      </div>
    </div>
    <a routerLink="/lyd" (click)="closeMenus()">Lydmeditation</a>
    <a routerLink="/om" (click)="closeMenus()">Vision</a>
    <a routerLink="/kontakt" (click)="closeMenus()">Kontakt</a>
  </nav>
</header>
